services:
  postgres:
    image: postgres:16
    container_name: zen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: zen123
      POSTGRES_DB: zendb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
